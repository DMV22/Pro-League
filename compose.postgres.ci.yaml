services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${CI_POSTGRES_DB:?Set a dedicated CI database name}
      POSTGRES_USER: ${CI_POSTGRES_USER:-proleague}
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?Set a disposable CI password}
    ports:
      - '127.0.0.1:${CI_POSTGRES_PORT:-5435}:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

name: Preview Lighthouse

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview-lighthouse:
    name: preview-lighthouse
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment_url, 'https://pro-league-development-pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LHCI_BASE_URL: ${{ github.event.deployment_status.environment_url }}
    steps:
      - name: Validate Render Preview origin
        shell: bash
        run: |
          if [[ ! "$LHCI_BASE_URL" =~ ^https://pro-league-development-pr-[0-9]+\.onrender\.com/?$ ]]; then
            echo 'Unexpected Render Preview URL'
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22.14.0
          cache: true
          require-lockfile: true
      - name: Warm Preview and verify noindex
        shell: bash
        run: |
          preview_origin="${LHCI_BASE_URL%/}"
          headers=$(curl --fail --silent --show-error --max-time 90 --dump-header - --output /dev/null "$preview_origin/")
          if [[ "${headers,,}" != *'x-robots-tag: noindex'* ]]; then
            echo 'Render Preview must return X-Robots-Tag: noindex'
            exit 1
          fi
      - run: pnpm lighthouse
      - name: Upload Preview Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-lighthouse-${{ github.run_id }}
          path: artifacts/lighthouse
          if-no-files-found: ignore
          retention-days: 7

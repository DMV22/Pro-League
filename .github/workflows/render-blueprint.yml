name: Render Blueprint

on:
  pull_request:
    branches: [develop, main]
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml
      - scripts/preview/**
  push:
    branches: [develop, main]
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml
      - scripts/preview/**
  workflow_dispatch:

concurrency:
  group: render-blueprint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: render-blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      # PR code and the Blueprint are untrusted. No Environment or provider secrets here.
      - name: Install locked validation dependencies without lifecycle scripts
        run: npm ci --prefix scripts/preview --ignore-scripts --no-audit --no-fund
      - name: Validate Render Blueprint structure without API credentials
        run: npm --prefix scripts/preview run blueprint:validate
